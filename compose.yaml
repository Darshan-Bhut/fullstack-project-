services:
  web:
    build: .
    container_name: taskflow-web
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
    volumes:
      - taskflow-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  taskflow-data:
